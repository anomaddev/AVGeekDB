openapi: 3.1.0
info:
  title: AVGeekDB API
  version: 0.2.0
  description: Free API for aircraft types, airlines and airports. Requires an API key (x-api-key). Includes real airlines, aircraft types and airports (OurAirports); airline hubs are still SAMPLE only.
  license: { name: MIT, identifier: MIT }
servers: [{ url: "https://example.com/v1", description: "TODO: production domain" }]
security: [{ ApiKey: [] }]
components:
  securitySchemes:
    ApiKey: { type: apiKey, in: header, name: x-api-key }
  parameters:
    q: { name: q, in: query, schema: { type: string }, description: Case-insensitive free-text search }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    country: { name: country, in: query, schema: { type: string, pattern: "^[A-Z]{2}$" } }
    iata: { name: iata, in: query, schema: { type: string } }
    icao: { name: icao, in: query, schema: { type: string } }
  headers:
    DataVersion: { schema: { type: string }, description: Current dataset version }
    ApiVersion: { schema: { type: string }, description: API contract semver }
    RateLimitLimit: { schema: { type: integer } }
    RateLimitRemaining: { schema: { type: integer } }
    RateLimitReset: { schema: { type: integer }, description: Seconds until window resets }
  schemas:
    Meta:
      type: object
      required: [total, limit, offset, next_offset, data_version]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        next_offset: { type: [integer, "null"] }
        data_version: { type: string }
    Error: { type: object, properties: { error: { type: string } } }
    Airport: { $ref: "../schema/airports.schema.json" }
    Airline:
      allOf:
        - { $ref: "../schema/airlines.schema.json" }
        - type: object
          required: [hubs]
          properties:
            hubs: { type: array, items: { type: string }, description: "Hub airport ICAO codes (primary first), from the airline_hubs join table" }
    AircraftType: { $ref: "../schema/aircraft_types.schema.json" }
  responses:
    BadRequest: { description: Invalid parameters, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing or invalid key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Key revoked, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Rate limit exceeded, headers: { Retry-After: { schema: { type: integer } } } }
paths:
  /airports:
    get:
      summary: List/search airports
      parameters: [{ $ref: "#/components/parameters/q" }, { $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/offset" }, { $ref: "#/components/parameters/iata" }, { $ref: "#/components/parameters/icao" }, { $ref: "#/components/parameters/country" }, { name: ident, in: query, schema: { type: string } }, { name: type, in: query, schema: { type: string, enum: [large_airport, medium_airport, small_airport, heliport, seaplane_base, balloonport, closed] } }, { name: continent, in: query, schema: { type: string, enum: [AF, AN, AS, EU, NA, OC, SA] } }, { name: iso_region, in: query, schema: { type: string }, description: "e.g. US-NY" }, { name: scheduled_service, in: query, schema: { type: boolean } }]
      responses:
        "200":
          description: OK
          headers: { x-api-version: { $ref: "#/components/headers/ApiVersion" }, x-data-version: { $ref: "#/components/headers/DataVersion" }, x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }, x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }, x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" } }
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Airport" } }, meta: { $ref: "#/components/schemas/Meta" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /airlines:
    get:
      summary: List/search airlines
      parameters: [{ $ref: "#/components/parameters/q" }, { $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/offset" }, { $ref: "#/components/parameters/iata" }, { $ref: "#/components/parameters/icao" }, { name: ident, in: query, schema: { type: string } }, { name: country, in: query, schema: { type: string }, description: Country name }, { name: country_code, in: query, schema: { type: string, pattern: "^[A-Z]{2}$" } }, { name: active, in: query, schema: { type: boolean } }, { name: major, in: query, schema: { type: boolean } }, { name: hub, in: query, schema: { type: string }, description: Airport ICAO code of a hub }]
      responses:
        "200":
          description: OK
          headers: { x-api-version: { $ref: "#/components/headers/ApiVersion" }, x-data-version: { $ref: "#/components/headers/DataVersion" } }
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Airline" } }, meta: { $ref: "#/components/schemas/Meta" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /aircraft:
    get:
      summary: List/search aircraft types
      parameters: [{ $ref: "#/components/parameters/q" }, { $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/offset" }, { name: ident, in: query, schema: { type: string } }, { name: icao, in: query, schema: { type: string } }, { name: iata, in: query, schema: { type: string } }, { name: family, in: query, schema: { type: string } }, { name: manufacturer, in: query, schema: { type: string } }, { name: engine_type, in: query, schema: { type: string } }, { name: aircraft_type, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { name: in_production, in: query, schema: { type: boolean } }, { name: major, in: query, schema: { type: boolean } }, { name: cargo, in: query, schema: { type: boolean } }, { name: military, in: query, schema: { type: boolean } }, { name: is_primary, in: query, schema: { type: boolean } }]
      responses:
        "200":
          description: OK
          headers: { x-api-version: { $ref: "#/components/headers/ApiVersion" }, x-data-version: { $ref: "#/components/headers/DataVersion" } }
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/AircraftType" } }, meta: { $ref: "#/components/schemas/Meta" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /version:
    get:
      summary: API and dataset versions
      security: []
      responses:
        "200":
          description: OK
          headers: { x-api-version: { $ref: "#/components/headers/ApiVersion" }, x-data-version: { $ref: "#/components/headers/DataVersion" } }
          content:
            application/json:
              schema:
                type: object
                required: [api_version, data_version]
                properties:
                  api_version: { type: string, description: API contract semver }
                  data_version: { type: string, description: Current dataset version }
