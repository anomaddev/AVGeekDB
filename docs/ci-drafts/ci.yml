# DRAFT: move to .github/workflows/ci.yml (needs a token with `workflow` scope).
name: CI
on:
  pull_request:
  push: { branches: [main] }
jobs:
  schema-check:
    name: Validate data/ against schema/ (JSON Schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run data:build   # fails on any row that violates schema/*.schema.json
      - uses: actions/upload-artifact@v4
        with: { name: data-dist, path: dist/ }
  build:
    runs-on: ubuntu-latest
    needs: schema-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { AVGEEKDB_MOCK: "true" }
