# DRAFT: move to .github/workflows/data-snapshot.yml (needs a token with `workflow` scope).
# Exports the current Supabase data (source of truth) into data/ and opens a PR with the dated snapshot.
# Required repo secrets (placeholders; set in Settings → Secrets and variables → Actions):
#   SUPABASE_URL               e.g. https://YOUR-PROJECT.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  service role key (read access to reference tables)
name: Data snapshot
on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency: { group: data-snapshot, cancel-in-progress: false }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Export Supabase → data/
        run: npm run data:export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Validate against schema/ and build artifacts
        run: npm run data:build
      - id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Open PR with snapshot (no-op if nothing changed)
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data-snapshot/${{ steps.date.outputs.date }}
          base: main
          add-paths: data/**
          commit-message: "data: snapshot ${{ steps.date.outputs.date }}"
          title: "Data snapshot ${{ steps.date.outputs.date }}"
          body: |
            Automated export of Supabase (source of truth) into `data/`, validated against `schema/`.
            Review diffs before merging. Generated by the data-snapshot workflow.
          author: "AVGeekDB Bot <anomaddev@users.noreply.github.com>"
          delete-branch: true
